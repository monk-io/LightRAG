namespace: lightrag

stack:
  defines: runnable
  inherits: lightrag/base
  metadata:
    name: LightRAG Production Stack
    description: |
      Secure production-oriented standalone LightRAG stack. It uses persistent
      file-backed storage and exposes HTTP only through Monk ingress. Set the
      sensitive lightrag-api-key, lightrag-auth-accounts, and
      lightrag-token-secret secrets before inheriting this for production.
    tags: rag, knowledge-graph, llm, retrieval, standalone, production, ingress
    website: https://github.com/HKUDS/LightRAG
    source: https://github.com/HKUDS/LightRAG
    publisher: monk.io
    private: false
  variables:
    api-key:
      type: string
      env: LIGHTRAG_API_KEY
      value: <- secret("lightrag-api-key")
      description: Sensitive API key; set lightrag-api-key when inheriting for authenticated production API access.
    auth-accounts:
      type: string
      env: AUTH_ACCOUNTS
      value: <- secret("lightrag-auth-accounts")
      description: Sensitive Web UI account list; set lightrag-auth-accounts when inheriting for authenticated production UI access.
    token-secret:
      type: string
      env: TOKEN_SECRET
      value: <- secret("lightrag-token-secret")
      description: Sensitive JWT signing secret; set lightrag-token-secret when inheriting for production Web UI sessions.
  permitted-secrets:
    lightrag-api-key: true
    lightrag-auth-accounts: true
    lightrag-token-secret: true
  services:
    http:
      container: main
      port: <- $port
      protocol: tcp
      publish: false
      description: LightRAG REST API and Web UI endpoint exposed only through Monk ingress in production.
      ingress-routes:
        app:
          path-prefix: /
  checks:
    readiness:
      code: http-get-service("lightrag/stack", "http", "/health") get-member("status") 200
      period: 10
      initialDelay: 20
      attempts: 60

stack-local-v2:
  defines: runnable
  inherits: lightrag/base
  metadata:
    name: LightRAG Local Stack
    description: |
      Local verification flavor for the standalone LightRAG stack. It uses the
      same public LightRAG image and self-contained storage defaults, and
      publishes a non-privileged host port for external HTTP health checks.
    tags: rag, knowledge-graph, llm, retrieval, standalone, local
    website: https://github.com/HKUDS/LightRAG
    source: https://github.com/HKUDS/LightRAG
    publisher: monk.io
    private: false
  variables:
    host-http-port:
      type: int
      value: 9622
      description: Non-privileged host port published for local LightRAG verification.
  services:
    http:
      container: main
      port: <- $port
      protocol: tcp
      host-port: <- $host-http-port
      description: Published local LightRAG REST API and Web UI endpoint for verification.
  checks:
    readiness:
      code: http-get-service("lightrag/stack-local-v2", "http", "/health") get-member("status") 200
      period: 10
      initialDelay: 20
      attempts: 60
